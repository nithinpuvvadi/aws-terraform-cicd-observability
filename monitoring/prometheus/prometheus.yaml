global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Automatically discover application EC2 instances
  - job_name: "flask-app"
    metrics_path: /metrics

    ec2_sd_configs:
      - region: us-east-1
        port: 5000
        refresh_interval: 60s

    relabel_configs:
      # Keep only application instances
      - source_labels: [__meta_ec2_tag_Role]
        regex: app
        action: keep

      # Use the private IP and application port
      - source_labels: [__meta_ec2_private_ip]
        target_label: __address__
        replacement: "${1}:5000"

      # Identify instances by EC2 instance ID
      - source_labels: [__meta_ec2_instance_id]
        target_label: instance
