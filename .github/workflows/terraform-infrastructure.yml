
name: Terraform Infrastructure Pipeline

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform-plan:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify checkout contents
        run: |
          echo "===== GITHUB WORKSPACE ====="
          echo "$GITHUB_WORKSPACE"

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo "===== CHECKED OUT COMMIT ====="
          git rev-parse HEAD

          echo "===== ROOT DIRECTORY CONTENTS ====="
          ls -la

          echo "===== TERRAFORM DIRECTORY ====="
          if [ -d "$GITHUB_WORKSPACE/terraform" ]; then
            ls -la "$GITHUB_WORKSPACE/terraform"
          else
            echo "ERROR: Terraform directory is missing"
            exit 1
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Terraform format check
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform fmt -check -recursive

      - name: Terraform initialize
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform init -input=false

      - name: Terraform validate
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform validate

      - name: Terraform plan
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform plan \
            -input=false \
            -var="image_tag=bootstrap-placeholder" \
            -out=tfplan

      - name: Export readable plan
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          retention-days: 5

