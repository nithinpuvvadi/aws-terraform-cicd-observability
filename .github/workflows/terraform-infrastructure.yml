
name: Terraform Infrastructure Pipeline

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "40-character Git commit SHA of the ECR image"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_INPUT: false

jobs:
  terraform-plan:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Capture source commit
        id: source
        run: |
          SOURCE_COMMIT=$(git rev-parse HEAD)
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Planning from commit: $SOURCE_COMMIT"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: image_tag must be a 40-character Git SHA"
            exit 1
          fi

          echo "Image tag format is valid: $IMAGE_TAG"

      - name: Verify image exists in ECR
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name aws-terraform-cicd-observability \
            --image-ids imageTag="$IMAGE_TAG"

      - name: Terraform format check
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform fmt -check -recursive

      - name: Terraform initialize
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform init -input=false

      - name: Terraform validate
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform validate

      - name: Terraform plan
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          cd "$GITHUB_WORKSPACE/terraform"

          terraform plan \
            -input=false \
            -var="image_tag=$IMAGE_TAG" \
            -out=tfplan

      - name: Export readable plan
        run: |
          cd "$GITHUB_WORKSPACE/terraform"
          terraform show -no-color tfplan > tfplan.txt

      - name: Create plan metadata
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          cd "$GITHUB_WORKSPACE/terraform"

          {
            echo "source_commit=$SOURCE_COMMIT"
            echo "image_tag=$IMAGE_TAG"
            echo "plan_run_id=$GITHUB_RUN_ID"
          } > plan-metadata.txt

          cat plan-metadata.txt

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_id }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
            terraform/plan-metadata.txt
          retention-days: 5

